    <!--
      Paint the loader's background before any JS/CSS loads so the preloader
      doesn't flash a bare screen first. Only applied when the loader will
      actually show (first visit of the session, motion allowed).
    -->
    <style>
      html.binary-pending,
      html.binary-pending body {
        background-color: #f0f6ff;
      }
    </style>
    <script>
      (function () {
        try {
          var reduced =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var seen = false;
          try {
            seen = sessionStorage.getItem("alkairis-preloader-seen") === "1";
          } catch (e) {
            /* sessionStorage unavailable (privacy mode) — treat as not seen */
          }
          if (!reduced && !seen) {
            document.documentElement.classList.add("binary-pending");
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
